[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-privacy-firewall-backend"
version = "0.1.0"
description = "FastAPI scaffold for AI-Privacy-Firewall"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "bcrypt>=3.1,<4.1",
    "fastapi",
    "joblib>=1.4,<2.0",
    "pandas>=2.2,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "pyarrow>=19.0,<25.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "scikit-learn>=1.7,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "black",
    "pandas-stubs",
    "pytest",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2.0",
    "shap>=0.46,<1.0",
    "types-passlib",
    "types-PyYAML",
    "types-python-jose",
    "xgboost>=2.0,<4.0",
]
xgboost = [
    "xgboost>=2.0,<4.0",
]
shap = [
    "shap>=0.46,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
